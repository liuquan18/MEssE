# RF plugin (comin_plugin_torch/fieldspace_RF_plugin.py) at R2B8. The runscript points to this file
# with MESSE_RF_CONFIG. Every key is required and unknown keys stop the run at startup. A copy of
# the file goes to the experiment folder, so edit it freely between jobs.

run:
  icon_var: uas                  # AES 10 m zonal wind (u_10m in NWP)
  sample_seconds: 600            # forecast lead and context spacing; rounded to whole ICON steps
  dry_run_seconds: 86400         # per-cell mean/std of the field
  save_interval_seconds: 86400
  log_seconds: 3600              # one log line, the mean over its sample steps

grid:
  dir: /pool/data/ICON/grids/mpim   # Earth_IcosS_* files, nested at every level
  levels: [4, 6, 7, 8]           # R2B levels, backbone first; the last must be ICON's grid
  latent_level: 6                # each residual level finer than this is folded into the next coarser one

forcings:                        # condition the blocks, not compressed; one global mean/std each
  icon_fields: [ts_wtr, sic]     # SST (water tile) and sea ice from ICON's GPU memory, each sample step
  insolation: true               # TOA incoming shortwave, computed from time and cell centres
  statics: [oromea]              # from static_file, once at startup (ComIn's orog reads zero)
  static_file: bc_land_sso.nc    # relative to the run directory, comin bug, we use comin instead of reading in the v1.00
  reconstructor: [ts_wtr, sic, oromea]   # no clock: job 28418236; the forecaster gets all of them

blocks:                          # every attention and compress block of both models
  att_dim: 128
  n_head_channels: 8
  hidden_dim: 64                 # MLP of the compress/decompress layers
  embed_dim: 8                   # time embedding and each cell's forcing embedding; at least 6

training:
  grad_clip: 1.0                 # per model

reconstructor:
  n_blocks: 2                    # attention blocks before and after each compression stage
  latent_channels: 4             # at latent_level: 1 + 16 x 4 = 65 values per 256 R2B8 values
  inner_channels: 8              # at the levels in between (R2B7'); does not change the latent size of compressed states
  time_input: false              # false: a constant time, no clock
  ema_decay: 0.99                # frozen copy: encodes every latent, decodes every forecast
  lr: 1.0e-3
  lr_warmup_seconds: 180000      # linear ramp, 300 updates at 600 s

forecaster:
  n_blocks: 2
  n_context: 10                  # frozen latents it sees: 100 min at 600 s
  lr: 2.0e-4
  replay_seconds: 864000         # model time of windows kept: 10 days; 0 = off
  replay_warmup_seconds: 172800  # windows touching the first 2 days after the dry run are never drawn
  replay_batch: 10               # windows drawn per update, on top of the live one
